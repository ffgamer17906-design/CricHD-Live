<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cric HD Live - Premium Streaming</title>
    <!-- Premium Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- HLS for Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-base: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #ff2a2a;
            --accent-glow: rgba(255, 42, 42, 0.4);
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 10, 15, 1) 0%, var(--bg-base) 70%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 📢 Breaking News Ticker */
        .ticker-wrap {
            background: #ff2a2a; color: white; padding: 4px 0; font-size: 11px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            overflow: hidden; white-space: nowrap;
        }
        .ticker-move { display: inline-block; animation: ticker 20s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* ✨ Glass Header */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-verified { background: #1da1f2; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; }
        .header-controls { display: flex; gap: 15px; align-items: center; }
        .live-clock { font-size: 13px; font-weight: 600; color: var(--text-muted); }

        /* 🧹 Clean Mode Button */
        .btn-clean {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 5px;
        }
        .btn-clean:hover { background: rgba(255,255,255,0.1); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 5%; display: flex; flex-direction: column; gap: 25px; transition: 0.5s; }

        /* 🎬 Netflix-Style Player */
        .player-wrapper {
            background: #000; border-radius: var(--radius);
            border: 1px solid var(--glass-border); overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px var(--accent-glow);
            position: relative;
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; outline: none; }
        
        .live-status {
            position: absolute; top: 15px; left: 15px;
            background: rgba(255, 42, 42, 0.9); color: white;
            padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800;
            display: flex; align-items: center; gap: 6px; text-transform: uppercase;
        }
        .dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Player Controls Bar */
        .player-controls {
            display: flex; justify-content: space-between; padding: 15px;
            background: var(--glass-bg); border-top: 1px solid var(--glass-border);
            flex-wrap: wrap; gap: 10px;
        }
        .control-btn {
            background: transparent; border: 1px solid var(--glass-border);
            color: white; padding: 8px 15px; border-radius: 12px;
            cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;
        }
        .control-btn:hover { background: rgba(255,255,255,0.1); }
        .primary-btn { background: var(--accent); border-color: var(--accent); }

        /* 😊 Match Mood Indicator */
        .mood-board {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 20px; display: flex; justify-content: space-around; align-items: center;
        }
        .mood-item { text-align: center; cursor: pointer; transition: 0.2s; }
        .mood-item:hover { transform: scale(1.1); }
        .mood-emoji { font-size: 28px; }
        .mood-count { font-size: 12px; color: var(--text-muted); margin-top: 5px; font-weight: 600; }

        /* 📱 Bottom Navigation (Mobile) */
        .bottom-nav {
            display: none; position: fixed; bottom: 0; width: 100%;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border); z-index: 100;
            padding: 15px 20px; justify-content: space-between;
        }
        .nav-item { color: var(--text-muted); text-decoration: none; font-size: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-active { color: white; }

        /* 📌 Floating Telegram Button */
        .float-tg {
            position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px;
            background: #0088cc; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; text-decoration: none; box-shadow: 0 10px 25px rgba(0,136,204,0.5); z-index: 99; transition: 0.3s;
        }
        .float-tg:hover { transform: scale(1.1); }

        @media (max-width: 768px) {
            .bottom-nav { display: flex; }
            .float-tg { bottom: 85px; }
        }

        /* 🧹 Clean Mode Logic */
        body.clean-mode .hide-on-clean { display: none !important; }
        body.clean-mode .container { margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Ticker -->
    <div class="ticker-wrap hide-on-clean">
        <div class="ticker-move">🔥 CRIC HD LIVE: Enjoy Ad-Free Premium Interface • Join Telegram for Instant Match Updates 🚀</div>
    </div>

    <!-- Apple-Style Header -->
    <div class="header">
        <div class="logo">🏏 Cric HD <span style="color:var(--accent)">Live</span> <span class="badge-verified">✔ PRO</span></div>
        <div class="header-controls">
            <div class="live-clock" id="clock">00:00:00</div>
            <button class="btn-clean" onclick="toggleCleanMode()">🧹 Clean Mode</button>
        </div>
    </div>

    <div class="container" id="mainContainer">
        
        <!-- Video Player -->
        <div class="player-wrapper">
            <div class="live-status"><div class="dot"></div> LIVE</div>
            <video id="video" controls autoplay playsinline></video>
            
            <div class="player-controls">
                <button class="control-btn" onclick="video.requestPictureInPicture()">📺 Mini Player (PiP)</button>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="control-btn" style="border:none; cursor:default;">👁️ <span id="viewers">1,245</span> Watching</div>
                    <button class="control-btn primary-btn" onclick="fireConfetti()">🎉 Celebrate</button>
                </div>
            </div>
        </div>

        <!-- Mood Indicator -->
        <div class="mood-board hide-on-clean">
            <div class="mood-item" onclick="addMood('fire')"><div class="mood-emoji">🔥</div><div class="mood-count" id="fireCount">842</div></div>
            <div class="mood-item" onclick="addMood('love')"><div class="mood-emoji">😍</div><div class="mood-count" id="loveCount">520</div></div>
            <div class="mood-item" onclick="addMood('shock')"><div class="mood-emoji">🤯</div><div class="mood-count" id="shockCount">125</div></div>
            <div class="mood-item" onclick="addMood('sad')"><div class="mood-emoji">😟</div><div class="mood-count" id="sadCount">12</div></div>
        </div>

        <!-- Legal/Footer Links -->
        <div class="hide-on-clean" style="text-align: center; border-top: 1px solid var(--glass-border); padding: 30px 0; margin-top: 10px;">
            <p style="font-size: 12px; color: var(--text-muted); display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <a href="#" style="color: #aaa; text-decoration: none;">FAQ</a>
                <a href="#" style="color: #aaa; text-decoration: none;">Privacy Policy</a>
                <a href="#" style="color: #aaa; text-decoration: none;">DMCA</a>
                <a href="#" style="color: #aaa; text-decoration: none;">About</a>
            </p>
            <p style="font-size: 11px; color: #666; margin-top: 10px;">© 2026 Cric HD Live. All rights reserved.</p>
        </div>

    </div>

    <!-- Floating Telegram -->
    <a href="https://t.me/+ouZw7zirxIsyNTI1" target="_blank" class="float-tg hide-on-clean">✈️</a>

    <!-- Mobile Nav -->
    <div class="bottom-nav hide-on-clean">
        <a href="#" class="nav-item nav-active">🏠<span>Home</span></a>
        <a href="#" class="nav-item">📺<span>Live</span></a>
        <a href="#" class="nav-item">🏆<span>Matches</span></a>
        <a href="#" class="nav-item">⚙️<span>Settings</span></a>
    </div>

    <script>
        // Aapki nayi link yahan set kar di gayi hai:
        var videoSrc = "https://tvsen7.aynaott.com/sspts1/tracks-v1a1/mono.ts.m3u8";
        var video = document.getElementById('video');
        
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
            
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    if(data.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); }
                    else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', () => video.play());
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
        }, 1000);

        setInterval(() => {
            let current = parseInt(document.getElementById('viewers').innerText.replace(',', ''));
            let updated = Math.max(1200, current + (Math.floor(Math.random() * 11) - 5));
            document.getElementById('viewers').innerText = updated.toLocaleString();
        }, 3000);

        function toggleCleanMode() {
            document.body.classList.toggle('clean-mode');
        }

        let moods = { fire: 842, love: 520, shock: 125, sad: 12 };
        function addMood(type) {
            moods[type]++;
            document.getElementById(type + 'Count').innerText = moods[type];
        }

        function fireConfetti() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ff2a2a', '#ffffff', '#0088cc'] });
        }
    </script>
</body>
</html>
