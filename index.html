<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crichd Live - Watch Live Match</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .header {
            width: 100%;
            background-color: #000;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #ff3b30;
            box-sizing: border-box;
        }
        .header h1 {
            margin: 0; font-size: 28px; font-weight: 900;
            color: #ffffff; letter-spacing: 1px; text-transform: uppercase;
        }
        .header span { color: #ff3b30; }
        .live-badge {
            background-color: #ff3b30; color: white; padding: 4px 10px;
            font-size: 12px; font-weight: bold; border-radius: 20px;
            animation: blink 1.5s infinite; display: inline-block; margin-top: 5px;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        .video-container {
            width: 95%; max-width: 900px; 
            margin: 20px auto 10px auto; 
            background-color: #000; 
            border-radius: 10px;
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            outline: none;
        }

        .telegram-btn-container {
            width: 95%; max-width: 900px;
            text-align: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        .telegram-btn {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #00aaff;
            transition: transform 0.3s ease;
        }
        .telegram-btn:hover {
            transform: scale(1.05);
        }
    </style>
    <!-- HLS.js Player Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div class="header">
        <h1>🏏 Crichd <span>Live</span></h1>
        <div class="live-badge">● LIVE NOW</div>
    </div>

    <div class="video-container">
        <div class="video-wrapper">
            <!-- Hamara apna clean video player jisme koi captcha nahi aayega -->
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
    </div>

    <div class="telegram-btn-container">
        <a href="https://t.me/+ouZw7zirxIsyNTI1" target="_blank" class="telegram-btn">
            <span>✈️</span> JOIN CRICHD LIVE TELEGRAM
        </a>
    </div>

    <script>
        // Aapki asli .m3u8 link (Proxy ke sath taaki CORS block na ho)
        var rawUrl = "https://tvsen7.aynaott.com/sspts1/tracks-v1a1/mono.ts.m3u8";
        var streamUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);
        
        var video = document.getElementById('videoPlayer');

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => {
                    console.log("Auto-play blocked, user interaction needed");
                });
            });
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari / iPhone ke liye
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(e => {});
            });
        }
    </script>

</body>
</html>
