<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crichd Live - Watch Live Match</title>
    <style>
        /* NORMAL SCROLL KE SATH CLEAN LOOK */
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .header {
            width: 100%;
            background-color: #000;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #ff3b30;
            box-sizing: border-box;
        }
        .header h1 {
            margin: 0; font-size: 28px; font-weight: 900;
            color: #ffffff; letter-spacing: 1px; text-transform: uppercase;
        }
        .header span { color: #ff3b30; }
        .live-badge {
            background-color: #ff3b30; color: white; padding: 4px 10px;
            font-size: 12px; font-weight: bold; border-radius: 20px;
            animation: blink 1.5s infinite; display: inline-block; margin-top: 5px;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        .video-container {
            width: 95%; max-width: 900px; 
            margin: 30px auto 15px auto; 
            background-color: #000; 
            border-radius: 10px;
            position: relative;
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            /* Iframe ko lamba kiya hai taaki website theek se dikhe */
            height: 600px; 
        }
        .iframe-wrapper {
            width: 100%; height: 100%;
        }
        .iframe-wrapper iframe {
            width: 100%; height: 100%;
            border: none; background-color: white;
        }

        .telegram-btn-container {
            width: 95%; max-width: 900px;
            text-align: center;
            margin-bottom: 30px;
        }
        .telegram-btn {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #00aaff;
            transition: transform 0.3s ease;
        }
        .telegram-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏏 Crichd <span>Live</span></h1>
        <div class="live-badge">● LIVE NOW</div>
    </div>

    <div class="video-container">
        <div class="iframe-wrapper">
            <!-- Aapki di hui player website yahan lagi hai -->
            <iframe 
                src="https://www.lvprompts.com/p/free-online-video-player-stream-mkv-mp4.html" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="telegram-btn-container">
        <a href="https://t.me/+ouZw7zirxIsyNTI1" target="_blank" class="telegram-btn">
            <span>✈️</span> JOIN CRICHD LIVE TELEGRAM
        </a>
    </div>

</body>
</html>
