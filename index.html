<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crichd Live - Watch Live Match</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .header {
            width: 100%;
            background-color: #161616;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            border-bottom: 3px solid #ff3b30;
            box-sizing: border-box;
        }
        .header h1 {
            margin: 0; font-size: 24px; font-weight: 900;
            color: #ffffff; letter-spacing: 1px; text-transform: uppercase;
        }
        .header span { color: #ff3b30; }

        /* 🔴 Floating LIVE Logo */
        .floating-live-logo {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: rgba(255, 59, 48, 0.95);
            color: white;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 900;
            border-radius: 30px;
            z-index: 9999;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.5);
            animation: pulse-live 1.5s infinite;
            text-transform: uppercase;
        }
        @keyframes pulse-live {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Video Container */
        .video-container {
            width: 95%; max-width: 950px; 
            margin: 20px auto 10px auto; 
            background-color: #000; 
            border-radius: 12px;
            overflow: hidden; 
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            border: 1px solid #333;
        }
        
        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: black;
            outline: none;
        }

        /* Action Buttons Bar */
        .action-bar {
            width: 95%; max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px auto;
            gap: 10px;
        }
        .action-btn {
            flex: 1;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: white;
            text-transform: uppercase;
        }
        .cheer-btn { background: linear-gradient(135deg, #ff3b30, #ff6b6b); }
        .telegram-btn { background: linear-gradient(135deg, #0088cc, #00aaff); }

        /* 💬 Live Chat Box */
        .chat-container {
            width: 95%; max-width: 950px;
            background-color: #161616;
            border-radius: 12px;
            border: 1px solid #333;
            margin: 15px auto 30px auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 250px;
        }
        .chat-header { background-color: #202020; padding: 10px 15px; font-weight: bold; font-size: 13px; border-bottom: 1px solid #333; color: #ff3b30; }
        .chat-messages { flex: 1; padding: 10px 15px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { background-color: #262626; padding: 6px 10px; border-radius: 8px; width: fit-content; max-width: 80%; }
        .chat-msg span { font-weight: bold; color: #00aaff; margin-right: 5px; }
        .chat-input-box { display: flex; padding: 8px 12px; background-color: #202020; border-top: 1px solid #333; }
        .chat-input-box input { flex: 1; background-color: #111; border: 1px solid #444; padding: 8px 12px; color: white; border-radius: 20px; outline: none; font-size: 13px; }
        .chat-input-box button { background-color: #ff3b30; color: white; border: none; padding: 8px 16px; margin-left: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
    <!-- HLS.js Library for smooth .m3u8 playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div class="floating-live-logo">🔴 LIVE</div>

    <div class="header">
        <h1>🏏 Crichd <span>Live</span></h1>
    </div>

    <!-- Video Player Container -->
    <div class="video-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <!-- Interactive Buttons Bar -->
    <div class="action-bar">
        <button class="action-btn cheer-btn" onclick="sendCheer()">❤️ CHEER (<span id="cheerCount">100</span>)</button>
        <a href="https://t.me/+ouZw7zirxIsyNTI1" target="_blank" class="action-btn telegram-btn">✈️ Join Telegram</a>
    </div>

    <!-- Live Chat Box -->
    <div class="chat-container">
        <div class="chat-header">💬 Live Match Chat</div>
        <div class="chat-messages" id="chatBox">
            <div class="chat-msg"><span>Admin:</span> Proxy link update ho chuki hai, enjoy! 🔥</div>
        </div>
        <div class="chat-input-box">
            <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button onclick="postMessage()">Send</button>
        </div>
    </div>

    <script>
        // Aapki updated proxy link yahan set hai:
        var videoSrc = "https://tv1.wapgotube.workers.dev/proxy/https://tvsen7.aynaott.com/sspts1/tracks-v1a1/mono.ts.m3u8";
        var video = document.getElementById('video');

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => console.log("Autoplay blocked:", e));
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(e => console.log("Autoplay blocked:", e));
            });
        }

        let count = 100;
        function sendCheer() {
            count++;
            document.getElementById('cheerCount').innerText = count;
        }

        function postMessage() {
            var input = document.getElementById('msgInput');
            var text = input.value.trim();
            if(text !== "") {
                var chatBox = document.getElementById('chatBox');
                var newMsg = document.createElement('div');
                newMsg.className = 'chat-msg';
                newMsg.innerHTML = `<span>Viewer:</span> ${text}`;
                chatBox.appendChild(newMsg);
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
        function handleEnter(e) {
            if (e.key === 'Enter') { postMessage(); }
        }
    </script>

</body>
</html>
