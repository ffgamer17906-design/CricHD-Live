<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crichd Live - Watch Live Match</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            background-color: #000;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #ff3b30;
            box-sizing: border-box;
        }
        .header h1 {
            margin: 0; font-size: 28px; font-weight: 900;
            color: #ffffff; letter-spacing: 1px; text-transform: uppercase;
        }
        .header span { color: #ff3b30; }
        .live-badge {
            background-color: #ff3b30; color: white; padding: 4px 10px;
            font-size: 12px; font-weight: bold; border-radius: 20px;
            animation: blink 1.5s infinite; display: inline-block; margin-top: 5px;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        .video-container {
            width: 95%; max-width: 900px; margin: 30px auto 15px auto;
            background-color: #000; border-radius: 10px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #333;
        }
        .iframe-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0;
        }
        .iframe-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; background-color: black;
        }

        /* Naya VIP Telegram Button Design */
        .telegram-btn-container {
            width: 95%; max-width: 900px;
            text-align: center;
            margin-bottom: 25px;
        }
        .telegram-btn {
            display: inline-block;
            background-color: #0088cc; /* Telegram ka asli blue color */
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #00aaff;
        }
        .telegram-btn:hover {
            background-color: #0077b5;
            transform: scale(1.05); /* Mouse le jane par button bada hoga */
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.8);
        }
        .telegram-btn span {
            font-size: 22px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .match-info {
            width: 95%; max-width: 900px; margin-bottom: 30px;
            background: #1a1a1a; padding: 15px; border-radius: 8px;
            text-align: center; border-left: 4px solid #ff3b30; box-sizing: border-box;
        }
        .match-info p { margin: 0; font-size: 16px; color: #ccc; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏏 Crichd <span>Live</span></h1>
        <div class="live-badge">● LIVE NOW</div>
    </div>

    <div class="video-container">
        <div class="iframe-wrapper">
            <iframe 
                src="https://ro45-star-sports-2hd.pages.dev/" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Aapka Apna Telegram Button Yahan Hai -->
    <div class="telegram-btn-container">
        <a href="https://t.me/+ouZw7zirxIsyNTI1" target="_blank" class="telegram-btn">
            <span>✈️</span> JOIN CRICHD LIVE TELEGRAM
        </a>
    </div>

    <div class="match-info">
        <p>Agar video play nahi ho raha hai, toh apne page ko refresh karein.</p>
    </div>

</body>
</html>
