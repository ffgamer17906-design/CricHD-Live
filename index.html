<!DOCTYPE html>

            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Header Styling */
        .header {
            width: 100%;
            background-color: #000;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #ff3b30;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header span {
            color: #ff3b30; /* Red color for 'Live' */
        }
        .live-badge {
            background-color: #ff3b30;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            animation: blink 1.5s infinite;
            display: inline-block;
            margin-top: 5px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Video Player Container (Responsive 16:9) */
        .video-container {
            width: 95%;
            max-width: 900px;
            margin: 30px auto;
            background-color: #222;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        
        /* Maintain 16:9 Aspect Ratio */
        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
        }
        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer Info */
        .match-info {
            width: 95%;
            max-width: 900px;
            margin-bottom: 30px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #007aff;
        }
        .match-info p {
            margin: 0;
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
